spring.application.name=fairteam-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/fairteam_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA and schema migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Existing Render databases already contain the original FairTeam schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Server
server.port=${PORT:8080}

# Application-owned teacher accounts (JWT + BCrypt)
fairteam.security.jwt-secret=${JWT_SECRET:}

# AI service
fairteam.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
fairteam.ai.generate-workshop-path=/api/v1/workshops/generate
fairteam.ai.service-token=${AI_SERVICE_TOKEN:}

# Study material upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
