```properties
spring.application.name=fairteam-backend

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/fairteam_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=false

# Server
server.port=${PORT:8080}

# Firebase Authentication
fairteam.security.auth-required=${AUTH_REQUIRED:false}
fairteam.security.firebase-project-id=${FIREBASE_PROJECT_ID:}
fairteam.security.allowed-teachers=${FAIRTEAM_ALLOWED_TEACHER_EMAILS:}
fairteam.security.allow-any-google-user=${AUTH_ALLOW_ANY_GOOGLE_USER:false}

# AI service
fairteam.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
fairteam.ai.generate-workshop-path=/api/v1/workshops/generate
fairteam.ai.service-token=${AI_SERVICE_TOKEN:}

# Study material upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
```